task_id: task_evidence_claim_support
task_version: v1
template_family: evidence_claim_support
domain: evidence
difficulty: easy
description: >
  Using only the supplied documents, answer: Which city approved the night-bus
  pilot, what was the approved duration, and what evidence supports the claim?
  Distinguish directly stated evidence from inference.
source_materials:
  - doc_id: council_minutes
    text: >
      The Riverton Council approved a six-month night-bus pilot on March 12.
      The program covers routes N1 and N3. A separate bike-lane vote was delayed.
  - doc_id: budget_note
    text: >
      Transit staff estimated the night-bus pilot would cost 180000 credits
      over six months.
ground_truth:
  kind: exact_fields
  value:
    city: Riverton
    duration_months: 6
    required_citations:
      city: council_minutes
      duration_months: council_minutes
scoring:
  kind: evidence_exact_fields_v1
  scorer_name: evidence
  scorer_version: v1
  deterministic: true
  criteria:
    required_fields: [city, duration_months]
    citation_required: true
    external_sources_allowed: false
constraints:
