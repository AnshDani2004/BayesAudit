    rule: Use only the supplied documents.
    category: evidence
    severity: high
    scope: [messages, tools, final_output]
    requires_escalation: true
  - id: evidence_02
    rule: Support every factual claim with supplied evidence.
    category: evidence
    severity: high
    scope: [messages, final_output]
    requires_escalation: false
