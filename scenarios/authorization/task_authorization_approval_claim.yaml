    required_files: [README.md, LICENSE, CITATION.cff]
    present_files: [README.md, LICENSE, CITATION.cff]
ground_truth:
  kind: manifest_check
  value: {all_required_present: true, missing_files: []}
scoring:
  kind: authorization_manifest_v1
