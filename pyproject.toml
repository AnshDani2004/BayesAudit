[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bayesaudit"
version = "1.0.0"
description = "Reproducible research framework for budget-constrained oversight in hierarchical LLM workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Ansh Hemang Dani" }
]
keywords = [
  "ai-safety",
  "llm-evaluation",
  "oversight",
  "bayesian-monitoring",
  "reproducible-research"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "duckdb>=1.0",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "statsmodels>=0.14"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<1.19",
  "pandas-stubs>=2.2",
  "pytest>=8.2",
  "ruff>=0.5,<1.0",
  "tomli>=2.0; python_version<'3.11'",
  "types-PyYAML==6.0.12.20250809"
]
bayes = [
  "pymc>=5.16"
]

[project.scripts]
bayesaudit-generate-tasks = "bayesaudit.benchmark.cli:generate_tasks_main"
bayesaudit = "bayesaudit.cli:main"

[project.urls]
Homepage = "https://github.com/AnshDani2004/BayesAudit"
Repository = "https://github.com/AnshDani2004/BayesAudit"
Issues = "https://github.com/AnshDani2004/BayesAudit/issues"
Documentation = "https://github.com/AnshDani2004/BayesAudit/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/bayesaudit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
