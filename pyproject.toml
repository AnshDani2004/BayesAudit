[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bayesaudit"
version = "0.1.0"
description = "Adaptive, budget-constrained oversight for hierarchical LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "BayesAudit contributors" }
]
dependencies = [
  "duckdb>=1.0",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "statsmodels>=0.14"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<1.19",
  "pandas-stubs>=2.2",
  "pytest>=8.2",
  "ruff>=0.5,<1.0",
  "types-PyYAML==6.0.12.20250809"
]
bayes = [
  "pymc>=5.16"
]

[project.scripts]
bayesaudit-generate-tasks = "bayesaudit.benchmark.cli:generate_tasks_main"
bayesaudit = "bayesaudit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bayesaudit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
