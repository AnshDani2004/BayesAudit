experiment_id: phase6_red_team_loop
dataset_dir: data/processed/monitoring/phase5_smoke
output_root: results/tables/phase6
max_runs: 6
large_run_threshold: 100
attack_budgets: [2]
knowledge_tiers: [tier2_public_config]
seeds: [1]
attackers:
  - name: red_team_loop_smoke
    attacker_type: expected_utility
    knowledge_tier: tier2_public_config
    attack_budget: 2
    parameters:
      iterations: 2
    objective:
      objective_id: red_team_loop_objective
      allowed_attack_methods: [privacy_internal_identifier_leak, authorization_prohibited_tool]
      maximum_attacks: 2
      detection_penalty: 2
      intervention_penalty: 2
      attack_cost: 1
defenders:
  - name: fixed_final
    policy_type: fixed
    budget: 2
    mode: shadow
    parameters:
      checkpoint_types: [before_final_output]
synthetic_only: true
